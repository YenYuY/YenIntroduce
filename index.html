<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>標準時間與分貝計</title>
  <style>
    :root {
      --bg: #0d1117;
      --panel: #161b22;
      --text: #e6edf3;
      --muted: #9da7b3;
      --accent: #2f81f7;
      --ok: #3fb950;
      --warn: #d29922;
      --danger: #f85149;
      --border: #30363d;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Noto Sans TC", "PingFang TC", sans-serif;
      color: var(--text);
      color-scheme: dark;
      background:
        radial-gradient(circle at 10% 10%, #1f2631, transparent 45%),
        linear-gradient(135deg, #0d1117 0%, #111827 100%);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
    }

    .app {
      width: min(860px, 100%);
      display: grid;
      gap: 16px;
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 12px 24px rgba(0, 0, 0, 0.28);
    }

    h1, h2 {
      margin: 0 0 12px;
      line-height: 1.2;
    }

    h1 {
      font-size: 1.35rem;
    }

    h2 {
      font-size: 1.05rem;
    }

    .date {
      font-size: 1.05rem;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .time {
      font-size: clamp(2rem, 6vw, 3.3rem);
      font-variant-numeric: tabular-nums;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }

    .meta {
      color: var(--muted);
      font-size: 0.95rem;
      line-height: 1.5;
    }

    .status-ok {
      color: var(--ok);
    }

    .status-warn {
      color: var(--warn);
    }

    .row {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 12px;
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 0.95rem;
      background: var(--accent);
      color: #fff;
      cursor: pointer;
    }

    button.secondary {
      background: #4b5563;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .db-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 8px;
    }

    .db-now {
      font-size: clamp(1.7rem, 5vw, 2.4rem);
      font-variant-numeric: tabular-nums;
    }

    .meter {
      width: 100%;
      height: 20px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: #0f141b;
      overflow: hidden;
    }

    .meter-fill {
      width: 0%;
      height: 100%;
      background: var(--ok);
      transition: width 120ms linear, background-color 120ms linear;
    }

    .calibration {
      margin-top: 12px;
      color: var(--muted);
      font-size: 0.93rem;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    input[type="range"] {
      width: min(360px, 100%);
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="card">
      <h1>標準時間與日期</h1>
      <div id="date" class="date">--</div>
      <div id="time" class="time">--:--:--</div>
      <div id="source" class="meta">資料來源：同步中...</div>
      <div id="clock-status" class="meta">正在連線國家標準時間伺服器...</div>
      <div class="row">
        <button id="sync-btn" type="button">立即重新同步</button>
      </div>
    </section>

    <section class="card">
      <h2>分貝計</h2>
      <div class="db-head">
        <div id="db-value" class="db-now">0.0 dB</div>
        <div id="db-peak" class="meta">峰值：0.0 dB</div>
      </div>
      <div class="meter" aria-label="分貝強度">
        <div id="meter-fill" class="meter-fill"></div>
      </div>
      <div class="row">
        <button id="start-btn" type="button">啟動麥克風</button>
        <button id="stop-btn" class="secondary" type="button" disabled>停止</button>
      </div>
      <label class="calibration" for="calibration">
        校正值（依裝置可微調）：
        <input id="calibration" type="range" min="70" max="120" step="1" value="95">
        <span id="calibration-value">95</span>
      </label>
      <div class="meta">提醒：此分貝值為網頁估算，若需精準 dB SPL，請使用校正過的實體分貝計。</div>
    </section>
  </main>

  <script>
    const STDTIME_ENDPOINT = "https://www.stdtime.gov.tw/Home/GetServerTime";

    const dateEl = document.getElementById("date");
    const timeEl = document.getElementById("time");
    const sourceEl = document.getElementById("source");
    const clockStatusEl = document.getElementById("clock-status");
    const syncBtn = document.getElementById("sync-btn");

    const clockState = {
      offsetMs: 0,
      synced: false,
      syncLatencyMs: null,
      lastServerMs: null,
      hasTriedSync: false,
      error: ""
    };

    function formatTaipeiDate(date) {
      return new Intl.DateTimeFormat("zh-TW", {
        timeZone: "Asia/Taipei",
        year: "numeric",
        month: "2-digit",
        day: "2-digit",
        weekday: "long"
      }).format(date);
    }

    function formatTaipeiTime(date) {
      return new Intl.DateTimeFormat("zh-TW", {
        timeZone: "Asia/Taipei",
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit",
        hour12: true
      }).format(date);
    }

    function parseServerTime(raw) {
      const trimmed = raw.trim();
      try {
        const parsed = JSON.parse(trimmed);
        if (typeof parsed === "string") {
          return Date.parse(parsed);
        }
      } catch (_) {
        return Date.parse(trimmed);
      }
      return Number.NaN;
    }

    async function syncClock() {
      const started = Date.now();
      syncBtn.disabled = true;
      clockState.hasTriedSync = true;

      try {
        const res = await fetch(STDTIME_ENDPOINT, { cache: "no-store" });
        if (!res.ok) {
          throw new Error("HTTP " + res.status);
        }

        const body = await res.text();
        const serverMs = parseServerTime(body);
        if (Number.isNaN(serverMs)) {
          throw new Error("時間格式解析失敗");
        }

        const ended = Date.now();
        const midpoint = started + (ended - started) / 2;

        clockState.offsetMs = serverMs - midpoint;
        clockState.synced = true;
        clockState.syncLatencyMs = ended - started;
        clockState.lastServerMs = serverMs;
        clockState.error = "";
      } catch (error) {
        clockState.synced = false;
        clockState.error = error instanceof Error ? error.message : "未知錯誤";
      } finally {
        syncBtn.disabled = false;
        renderClockMeta();
      }
    }

    function renderClock() {
      const baseNow = Date.now();
      const nowMs = clockState.synced ? baseNow + clockState.offsetMs : baseNow;
      const now = new Date(nowMs);

      dateEl.textContent = formatTaipeiDate(now);
      timeEl.textContent = formatTaipeiTime(now);
    }

    function renderClockMeta() {
      if (!clockState.hasTriedSync) {
        sourceEl.textContent = "資料來源：同步中...";
        sourceEl.className = "meta";
        clockStatusEl.textContent = "正在連線國家標準時間伺服器...";
        clockStatusEl.className = "meta";
        return;
      }

      if (clockState.synced) {
        sourceEl.textContent = "資料來源：https://www.stdtime.gov.tw/Home/GetServerTime";
        sourceEl.className = "meta status-ok";

        const latest = new Date(clockState.lastServerMs);
        clockStatusEl.textContent =
          "同步成功，延遲約 " + clockState.syncLatencyMs + " ms，最近同步時間：" + formatTaipeiTime(latest);
        clockStatusEl.className = "meta status-ok";
        return;
      }

      sourceEl.textContent = "資料來源：本機時間（無法連線標準時間時的備援）";
      sourceEl.className = "meta status-warn";
      clockStatusEl.textContent = "同步失敗：" + clockState.error;
      clockStatusEl.className = "meta status-warn";
    }

    syncBtn.addEventListener("click", syncClock);

    setInterval(renderClock, 250);
    setInterval(syncClock, 60 * 1000);
    renderClock();
    renderClockMeta();
    syncClock();

    const dbValueEl = document.getElementById("db-value");
    const dbPeakEl = document.getElementById("db-peak");
    const meterFillEl = document.getElementById("meter-fill");
    const startBtn = document.getElementById("start-btn");
    const stopBtn = document.getElementById("stop-btn");
    const calibrationInput = document.getElementById("calibration");
    const calibrationValueEl = document.getElementById("calibration-value");

    let audioContext = null;
    let analyser = null;
    let stream = null;
    let frameId = null;
    let waveform = null;
    let currentDb = 0;
    let peakDb = 0;
    let lastMeterUpdateMs = 0;
    const METER_UPDATE_INTERVAL_MS = 120;

    function meterColor(db) {
      if (db < 50) return "var(--ok)";
      if (db < 80) return "var(--warn)";
      return "var(--danger)";
    }

    function estimateDb() {
      analyser.getFloatTimeDomainData(waveform);
      let sumSquares = 0;
      for (let i = 0; i < waveform.length; i += 1) {
        sumSquares += waveform[i] * waveform[i];
      }
      const rms = Math.sqrt(sumSquares / waveform.length);
      const dbfs = 20 * Math.log10(rms || 1e-8);
      const calibration = Number(calibrationInput.value);
      return Math.max(0, Math.min(120, dbfs + calibration));
    }

    function drawMeter(now = performance.now()) {
      if (now - lastMeterUpdateMs < METER_UPDATE_INTERVAL_MS) {
        frameId = requestAnimationFrame(drawMeter);
        return;
      }
      lastMeterUpdateMs = now;

      const rawDb = estimateDb();
      const alpha = rawDb > currentDb ? 0.1 : 0.04;
      currentDb = currentDb * (1 - alpha) + rawDb * alpha;
      peakDb = Math.max(currentDb, peakDb - 0.2);

      dbValueEl.textContent = currentDb.toFixed(1) + " dB";
      dbPeakEl.textContent = "峰值：" + peakDb.toFixed(1) + " dB";
      meterFillEl.style.width = (currentDb / 120 * 100).toFixed(1) + "%";
      meterFillEl.style.backgroundColor = meterColor(currentDb);

      frameId = requestAnimationFrame(drawMeter);
    }

    async function startMeter() {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        alert("此瀏覽器不支援麥克風 API。");
        return;
      }

      startBtn.disabled = true;
      try {
        stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        audioContext = new window.AudioContext();
        const sourceNode = audioContext.createMediaStreamSource(stream);
        analyser = audioContext.createAnalyser();
        analyser.fftSize = 2048;
        sourceNode.connect(analyser);
        waveform = new Float32Array(analyser.fftSize);

        currentDb = 0;
        peakDb = 0;
        lastMeterUpdateMs = 0;
        drawMeter();

        stopBtn.disabled = false;
      } catch (error) {
        startBtn.disabled = false;
        alert("無法啟動麥克風：" + (error instanceof Error ? error.message : "未知錯誤"));
      }
    }

    async function stopMeter() {
      if (frameId) {
        cancelAnimationFrame(frameId);
        frameId = null;
      }

      if (stream) {
        stream.getTracks().forEach(track => track.stop());
        stream = null;
      }

      if (audioContext) {
        await audioContext.close();
        audioContext = null;
      }

      analyser = null;
      waveform = null;
      startBtn.disabled = false;
      stopBtn.disabled = true;
    }

    startBtn.addEventListener("click", startMeter);
    stopBtn.addEventListener("click", stopMeter);

    calibrationInput.addEventListener("input", () => {
      calibrationValueEl.textContent = calibrationInput.value;
    });

    window.addEventListener("beforeunload", () => {
      if (stream) {
        stream.getTracks().forEach(track => track.stop());
      }
    });
  </script>
</body>
</html>
