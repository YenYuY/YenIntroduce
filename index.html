<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Yen Yu | Portfolio</title>
    <meta
      name="description"
      content="Yen Yu professional portfolio featuring iOS apps, web tools, enterprise IT, and digital delivery."
    />
    <style>
      :root {
        --bg: #edf3f8;
        --bg-soft: #f8fbfd;
        --surface: rgba(255, 255, 255, 0.9);
        --surface-strong: #ffffff;
        --ink: #0f172a;
        --muted: #475569;
        --line: rgba(15, 23, 42, 0.1);
        --brand: #0f766e;
        --brand-deep: #115e59;
        --accent: #2563eb;
        --navy: #0f172a;
        --navy-soft: #172235;
        --shadow: 0 24px 60px rgba(15, 23, 42, 0.08);
        --radius-xl: 28px;
        --radius-lg: 20px;
        --radius-md: 14px;
      }

      * {
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        margin: 0;
        color: var(--ink);
        font-family: "Avenir Next", "IBM Plex Sans", "PingFang TC", "Noto Sans TC", sans-serif;
        background:
          radial-gradient(circle at 0% 0%, rgba(37, 99, 235, 0.12), transparent 24%),
          radial-gradient(circle at 100% 10%, rgba(15, 118, 110, 0.12), transparent 20%),
          linear-gradient(180deg, var(--bg) 0%, var(--bg-soft) 48%, #f4f8fc 100%);
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        opacity: 0.12;
        background-image:
          linear-gradient(rgba(15, 23, 42, 0.03) 1px, transparent 1px),
          linear-gradient(90deg, rgba(15, 23, 42, 0.03) 1px, transparent 1px);
        background-size: 44px 44px;
        mask-image: linear-gradient(180deg, rgba(0, 0, 0, 0.8), transparent 92%);
      }

      a {
        color: inherit;
      }

      button {
        font: inherit;
      }

      .page {
        width: min(1180px, calc(100vw - 32px));
        margin: 0 auto;
        padding: 18px 0 84px;
      }

      .topbar {
        position: sticky;
        top: 10px;
        z-index: 20;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 18px;
        padding: 14px 18px;
        margin-bottom: 26px;
        border: 1px solid rgba(255, 255, 255, 0.84);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.82);
        backdrop-filter: blur(14px);
        box-shadow: 0 12px 34px rgba(15, 23, 42, 0.06);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .brand-mark {
        width: 40px;
        height: 40px;
        display: grid;
        place-items: center;
        border-radius: 14px;
        font-weight: 800;
        color: #eff6ff;
        background: linear-gradient(145deg, var(--navy), #1e293b);
        box-shadow: 0 10px 24px rgba(15, 23, 42, 0.18);
      }

      .brand-copy strong,
      .brand-copy span {
        display: block;
      }

      .brand-copy strong {
        font-size: 1rem;
        letter-spacing: 0.08em;
      }

      .brand-copy span {
        color: var(--muted);
        font-size: 0.8rem;
      }

      .topbar-right {
        display: flex;
        align-items: center;
        gap: 16px;
      }

      .nav {
        display: flex;
        gap: 18px;
        flex-wrap: wrap;
      }

      .nav a {
        text-decoration: none;
        color: var(--muted);
        font-size: 0.94rem;
        font-weight: 600;
      }

      .nav a:hover {
        color: var(--navy);
      }

      .lang-switch {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 4px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: rgba(248, 250, 252, 0.94);
      }

      .lang-switch button {
        border: 0;
        padding: 8px 14px;
        border-radius: 999px;
        background: transparent;
        color: var(--muted);
        cursor: pointer;
        transition: background 0.2s ease, color 0.2s ease;
      }

      .lang-switch button.active {
        color: #eff6ff;
        background: linear-gradient(145deg, var(--navy), #1e293b);
      }

      .hero {
        display: grid;
        grid-template-columns: minmax(0, 1.2fr) minmax(320px, 0.8fr);
        gap: 20px;
        align-items: stretch;
      }

      .panel {
        border: 1px solid rgba(255, 255, 255, 0.82);
        border-radius: var(--radius-xl);
        background: var(--surface);
        box-shadow: var(--shadow);
        overflow: hidden;
      }

      .hero-main {
        padding: 40px;
        color: #e5eefb;
        background:
          radial-gradient(circle at top right, rgba(37, 99, 235, 0.24), transparent 28%),
          linear-gradient(145deg, var(--navy), var(--navy-soft) 58%, #11314a);
      }

      .eyebrow {
        display: inline-flex;
        padding: 9px 14px;
        border-radius: 999px;
        background: rgba(148, 163, 184, 0.14);
        color: #cbd5e1;
        font-size: 0.84rem;
        font-weight: 800;
        letter-spacing: 0.04em;
      }

      .hero-main h1 {
        margin: 18px 0 12px;
        font-size: clamp(2.9rem, 6vw, 5.2rem);
        line-height: 0.92;
        letter-spacing: -0.05em;
        color: #f8fafc;
      }

      .lead {
        margin: 0;
        max-width: 700px;
        color: #cbd5e1;
        line-height: 1.88;
        font-size: 1.02rem;
      }

      .hero-cta {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 28px;
      }

      .button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 48px;
        padding: 12px 18px;
        border-radius: 14px;
        text-decoration: none;
        font-weight: 700;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }

      .button.primary {
        color: #eff6ff;
        background: linear-gradient(145deg, var(--brand), var(--brand-deep));
        box-shadow: 0 14px 28px rgba(15, 118, 110, 0.22);
      }

      .button.secondary {
        border: 1px solid rgba(203, 213, 225, 0.2);
        color: #f8fafc;
        background: rgba(255, 255, 255, 0.06);
      }

      .button:hover {
        transform: translateY(-2px);
      }

      .metric-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 12px;
        margin-top: 26px;
      }

      .metric {
        padding: 15px;
        border: 1px solid rgba(148, 163, 184, 0.14);
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.06);
      }

      .metric strong {
        display: block;
        margin-bottom: 6px;
        font-size: 1.15rem;
        color: #f8fafc;
      }

      .metric span {
        display: block;
        color: #cbd5e1;
        font-size: 0.92rem;
        line-height: 1.65;
      }

      .hero-side {
        display: grid;
        align-content: space-between;
        gap: 18px;
        padding: 28px;
        background:
          radial-gradient(circle at bottom right, rgba(15, 118, 110, 0.12), transparent 30%),
          linear-gradient(180deg, rgba(255, 255, 255, 0.98), rgba(247, 250, 252, 0.96));
      }

      .hero-side h2 {
        margin: 0 0 8px;
        font-size: 1.3rem;
      }

      .hero-side p {
        margin: 0;
        color: var(--muted);
        line-height: 1.82;
      }

      .info-stack {
        display: grid;
        gap: 12px;
      }

      .info-card {
        padding: 17px 18px;
        border: 1px solid rgba(15, 23, 42, 0.06);
        border-radius: 18px;
        background: rgba(248, 250, 252, 0.92);
      }

      .info-card strong,
      .info-card span,
      .info-card a {
        display: block;
      }

      .info-card strong {
        margin-bottom: 6px;
      }

      .info-card span,
      .info-card a {
        color: var(--muted);
        line-height: 1.7;
        text-decoration: none;
        word-break: break-word;
      }

      .info-card a:hover,
      .project-links a:hover,
      .contact-links a:hover {
        color: var(--navy);
      }

      .section {
        margin-top: 24px;
      }

      .section-head {
        display: flex;
        justify-content: space-between;
        align-items: start;
        gap: 16px;
        margin-bottom: 16px;
      }

      .section-head h2 {
        margin: 0;
        font-size: clamp(1.9rem, 3.2vw, 2.7rem);
        letter-spacing: -0.04em;
      }

      .section-head p {
        margin: 0;
        max-width: 620px;
        color: var(--muted);
        line-height: 1.8;
      }

      .section-head p:empty,
      .footer p:empty {
        display: none;
      }

      .summary-grid,
      .two-col,
      .project-grid,
      .meta-grid {
        display: grid;
        gap: 18px;
      }

      .summary-grid {
        grid-template-columns: 1.05fr 0.95fr;
      }

      .two-col {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .project-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .meta-grid {
        grid-template-columns: 1fr 1fr 1fr;
      }

      .content-card,
      .skill-card,
      .project-card,
      .timeline-card,
      .meta-card {
        padding: 24px;
        background: var(--surface-strong);
      }

      .content-card p {
        margin: 0;
        color: var(--muted);
        line-height: 1.92;
      }

      .list-grid {
        display: grid;
        gap: 14px;
      }

      .chip-list {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .chip {
        display: inline-flex;
        align-items: center;
        padding: 8px 11px;
        border-radius: 999px;
        border: 1px solid rgba(15, 23, 42, 0.08);
        background: rgba(248, 250, 252, 0.96);
        font-size: 0.88rem;
        color: var(--ink);
      }

      .skill-card h3,
      .project-card h3,
      .timeline-card h3,
      .meta-card h3 {
        margin: 0 0 12px;
        font-size: 1.18rem;
      }

      .skill-card ul,
      .project-card ul,
      .timeline-card ul,
      .meta-card ul {
        margin: 0;
        padding-left: 18px;
        color: var(--muted);
        line-height: 1.85;
      }

      .project-card p,
      .timeline-card p {
        margin: 0 0 14px;
        color: var(--muted);
        line-height: 1.82;
      }

      .project-card {
        position: relative;
        display: flex;
        flex-direction: column;
        min-height: 100%;
        padding: 26px;
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.98), rgba(248, 250, 252, 0.96));
      }

      .project-card::before {
        content: "";
        position: absolute;
        inset: 0 auto 0 0;
        width: 4px;
        background: linear-gradient(180deg, var(--accent), var(--brand));
      }

      .project-card.featured {
        grid-column: span 2;
        background:
          radial-gradient(circle at top right, rgba(37, 99, 235, 0.08), transparent 26%),
          linear-gradient(180deg, rgba(255, 255, 255, 0.99), rgba(248, 250, 252, 0.98));
      }

      .project-card h3 {
        font-size: 1.5rem;
      }

      .project-card ul {
        margin-bottom: 16px;
      }

      .tag {
        display: inline-flex;
        margin-bottom: 10px;
        padding: 7px 11px;
        border-radius: 999px;
        background: rgba(37, 99, 235, 0.1);
        color: var(--accent);
        font-size: 0.78rem;
        font-weight: 800;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      .timeline-card {
        border-left: 4px solid rgba(37, 99, 235, 0.24);
      }

      .timeline-card .period {
        display: inline-block;
        margin-bottom: 10px;
        color: var(--accent);
        font-weight: 700;
      }

      .project-links,
      .contact-links {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 14px;
      }

      .project-links a,
      .contact-links a {
        text-decoration: none;
        font-weight: 700;
        color: var(--accent);
      }

      .project-links a {
        display: inline-flex;
        align-items: center;
        min-height: 40px;
        padding: 8px 12px;
        border: 1px solid rgba(37, 99, 235, 0.16);
        border-radius: 999px;
        background: rgba(239, 246, 255, 0.9);
      }

      .footer {
        margin-top: 26px;
        padding: 12px 0 0;
        text-align: center;
        color: var(--muted);
      }

      .reveal {
        opacity: 0;
        transform: translateY(26px);
        transition: opacity 0.7s ease, transform 0.7s ease;
      }

      .reveal.visible {
        opacity: 1;
        transform: translateY(0);
      }

      @media (max-width: 980px) {
        .hero,
        .summary-grid,
        .two-col,
        .project-grid,
        .meta-grid {
          grid-template-columns: 1fr;
        }

        .project-card.featured {
          grid-column: span 1;
        }

        .metric-grid {
          grid-template-columns: 1fr;
        }

        .section-head {
          flex-direction: column;
        }
      }

      @media (max-width: 760px) {
        .page {
          width: min(calc(100vw - 18px), 1180px);
          padding-top: 10px;
        }

        .topbar {
          position: static;
          align-items: start;
          flex-direction: column;
          border-radius: 24px;
        }

        .topbar-right {
          width: 100%;
          align-items: start;
          flex-direction: column;
        }

        .nav {
          gap: 14px;
        }

        .hero-main,
        .hero-side,
        .content-card,
        .skill-card,
        .project-card,
        .timeline-card,
        .meta-card {
          padding: 22px;
        }

        .hero-main h1 {
          font-size: clamp(2.5rem, 12vw, 4rem);
        }
      }
    </style>
  </head>

      <section id="experience" class="section reveal">

      const langButtons = Array.from(document.querySelectorAll("[data-lang]"));
      const docTitle = document.querySelector("title");
      const metaDescription = document.querySelector('meta[name="description"]');

      function detectLanguage() {
        const saved = localStorage.getItem("preferred-language");
        if (saved === "zh" || saved === "en") {
          return saved;
        }

        const browserLangs = navigator.languages && navigator.languages.length
          ? navigator.languages
          : [navigator.language || "en"];

        return browserLangs.some((lang) => String(lang).toLowerCase().startsWith("zh")) ? "zh" : "en";
      }

      function fillChipList(containerId, items) {
        const container = document.getElementById(containerId);
        container.innerHTML = items.map((item) => `<span class="chip">${item}</span>`).join("");
      }

      function fillSimpleList(containerId, items) {
        const container = document.getElementById(containerId);
        container.innerHTML = items.map((item) => `<li>${item}</li>`).join("");
      }

      function renderSkills(items) {
        const grid = document.getElementById("skills-grid");
        grid.innerHTML = items
          .map(
            (item) => `
              <article class="panel skill-card">
                <h3>${item.title}</h3>
                <ul>${item.points.map((point) => `<li>${point}</li>`).join("")}</ul>
              </article>
            `
          )
          .join("");
      }

      function renderProjects(items) {
        const grid = document.getElementById("projects-grid");
        grid.innerHTML = items
          .map(
            (item, index) => `
              <article class="panel project-card${index === 0 ? " featured" : ""}">
                <span class="tag">${item.tag}</span>
                <h3>${item.title}</h3>
                <p>${item.body}</p>
                <ul>${item.points.map((point) => `<li>${point}</li>`).join("")}</ul>
                ${
                  item.links.length
                    ? `<div class="project-links">${item.links
                        .map(
                          (link) =>
                            `<a href="${link.href}" target="_blank" rel="noreferrer noopener">${link.label}</a>`
                        )
                        .join("")}</div>`
                    : ""
                }
              </article>
            `
          )
          .join("");
      }

      function renderExperience(items) {
        const grid = document.getElementById("experience-grid");
        grid.innerHTML = items
          .map(
            (item) => `
              <article class="panel timeline-card">
                <span class="period">${item.period}</span>
                <h3>${item.title}</h3>
                <p>${item.company}</p>
                <ul>${item.points.map((point) => `<li>${point}</li>`).join("")}</ul>
              </article>
            `
          )
          .join("");
      }

      function applyLanguage(lang) {
        const t = content[lang];

        document.documentElement.lang = lang === "zh" ? "zh-Hant" : "en";
        docTitle.textContent = t.pageTitle;
        metaDescription.setAttribute("content", t.metaDescription);

        document.getElementById("brand-role").textContent = t.brandRole;
        document.getElementById("nav-summary").textContent = t.nav.summary;
        document.getElementById("nav-skills").textContent = t.nav.skills;
        document.getElementById("nav-projects").textContent = t.nav.projects;
        document.getElementById("nav-experience").textContent = t.nav.experience;

        document.getElementById("hero-eyebrow").textContent = t.hero.eyebrow;
        document.getElementById("hero-title").textContent = t.hero.title;
        document.getElementById("hero-lead").textContent = t.hero.lead;
        document.getElementById("hero-cta-primary").textContent = t.hero.ctaPrimary;
        document.getElementById("hero-cta-secondary").textContent = t.hero.ctaSecondary;

        document.getElementById("metric-1-value").textContent = t.hero.metrics[0].value;
        document.getElementById("metric-1-label").textContent = t.hero.metrics[0].label;
        document.getElementById("metric-2-value").textContent = t.hero.metrics[1].value;
        document.getElementById("metric-2-label").textContent = t.hero.metrics[1].label;
        document.getElementById("metric-3-value").textContent = t.hero.metrics[2].value;
        document.getElementById("metric-3-label").textContent = t.hero.metrics[2].label;

        document.getElementById("hero-side-title").textContent = t.heroSide.title;
        document.getElementById("hero-side-body").textContent = t.heroSide.body;
        document.getElementById("contact-title").textContent = t.labels.contact;
        document.getElementById("portfolio-title").textContent = t.labels.portfolio;
        document.getElementById("store-title").textContent = t.labels.store;

        document.getElementById("projects-heading").textContent = t.projects.heading;
        document.getElementById("projects-intro").textContent = t.projects.intro;
        renderProjects(t.projects.items);

        document.getElementById("summary-heading").textContent = t.summary.heading;
        document.getElementById("summary-intro").textContent = t.summary.intro;
        document.getElementById("summary-body").textContent = t.summary.body;
        document.getElementById("focus-title").textContent = t.summary.focusTitle;
        document.getElementById("tooling-title").textContent = t.summary.toolingTitle;
        fillChipList("focus-list", t.summary.focus);
        fillChipList("tooling-list", t.summary.tooling);

        document.getElementById("skills-heading").textContent = t.skills.heading;
        document.getElementById("skills-intro").textContent = t.skills.intro;
        renderSkills(t.skills.items);

        document.getElementById("experience-heading").textContent = t.experience.heading;
        document.getElementById("experience-intro").textContent = t.experience.intro;
        renderExperience(t.experience.items);

        document.getElementById("background-heading").textContent = t.background.heading;
        document.getElementById("background-intro").textContent = t.background.intro;
        document.getElementById("education-title").textContent = t.background.educationTitle;
        document.getElementById("certifications-title").textContent = t.background.certificationTitle;
        document.getElementById("languages-title").textContent = t.background.languageTitle;
        fillSimpleList("education-list", t.background.education);
        fillSimpleList("certifications-list", t.background.certifications);
        fillSimpleList("languages-list", t.background.languages);

        document.getElementById("footer-copy").textContent = t.footer;

        langButtons.forEach((button) => {
          button.classList.toggle("active", button.dataset.lang === lang);
          button.setAttribute("aria-pressed", button.dataset.lang === lang ? "true" : "false");
        });

        localStorage.setItem("preferred-language", lang);
      }

      langButtons.forEach((button) => {
        button.addEventListener("click", () => applyLanguage(button.dataset.lang));
      });

      const revealObserver = new IntersectionObserver(
        (entries) => {
          entries.forEach((entry) => {
            if (entry.isIntersecting) {
              entry.target.classList.add("visible");
            }
          });
        },
        { threshold: 0.16 }
      );

      document.querySelectorAll(".reveal").forEach((node) => revealObserver.observe(node));

      applyLanguage(detectLanguage());
    </script>
